<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大分上野丘高校 デジタルサイネージ天気予報 (縦長250x850)</title>
    <!-- Tailwind CSS for layout & clean modern components -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons for weather indicators -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            /* Bright, active, school-appropriate sky morning gradient */
            background: linear-gradient(135deg, #e0f2fe 0%, #eff6ff 50%, #f0fdf4 100%);
            overflow: hidden;
            /* 【高精細化】3倍の解像度で描画（750x2550px） */
            width: 750px;
            height: 2550px;
            color: #0f172a; /* Slate 900 */
            
            /* 【にじみ防止対策】Android WebViewでのフォント描画をシャープにする設定 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        /* Strict 250x850 portrait container scaled down from 3x resolution via transform */
        .portrait-container {
            width: 750px;
            height: 2550px;
            position: absolute;
            top: 50%;
            left: 50%;
            /* 3倍サイズで描画したものを 1/3 に縮小して 250x850 の枠にミリ単位で完全フィット */
            transform: translate(-50%, -50%) scale(calc(1 / 3)) translateZ(0);
            transform-origin: center center;
            box-sizing: border-box;
            padding: 36px; /* 12px * 3 */
            backface-visibility: hidden;
        }
        /* Glassmorphism soft panels (Scaled 3x) */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border: 4.5px solid rgba(255, 255, 255, 0.7); /* 1.5px * 3 */
            box-shadow: 0 24px 60px -18px rgba(15, 23, 42, 0.08); /* 8px/20px * 3 */
        }
        /* Active weather gradients */
        .weather-gradient-sunny {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 4.5px solid #ffedd5;
        }
        .weather-gradient-cloudy {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 4.5px solid #f1f5f9;
        }
        .weather-gradient-rainy {
            background: linear-gradient(135deg, #f0f9ff 0%, #bae6fd 100%);
            border: 6px solid #bae6fd;
        }
        .weather-gradient-night {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 6px solid #4338ca;
        }
    </style>
</head>
<body>

    <div id="signage" class="portrait-container flex flex-col justify-between">
        
        <!-- HEADER: Simple Title without School Badge or Name (3x Scaled) -->
        <header class="flex items-center justify-center border-b-6 border-blue-900/10 pb-6 h-[165px] shrink-0">
            <h1 class="text-8xl font-black tracking-widest text-[#0f2347] flex items-center gap-6">
                <i class="fa-solid fa-cloud-sun text-blue-600"></i>気象情報
            </h1>
        </header>

        <!-- TODAY'S WEATHER CARD (3x Scaled) -->
        <section class="glass-card rounded-[48px] p-12 flex flex-col justify-between items-center h-[1020px] shadow-sm shrink-0">
            <div class="text-center w-full">
                <span class="px-9 py-1.5 bg-blue-50 text-blue-900 border-3 border-blue-200 rounded-full text-[30px] font-black tracking-wider inline-block">
                    大分市（上野丘周辺）
                </span>
            </div>

            <!-- Dynamic Weather Icon -->
            <div id="main-weather-bg" class="w-96 h-96 rounded-full flex items-center justify-center shadow-md weather-gradient-sunny border-9 my-3">
                <i id="main-weather-icon" class="fa-solid fa-sun text-[180px] text-amber-500 drop-shadow-sm"></i>
            </div>

            <!-- Temp & Weather Text info -->
            <div class="text-center w-full">
                <div id="main-weather-text" class="text-9xl font-black text-[#0f2347] mb-3">晴れ</div>
                <div class="flex items-center justify-center space-x-9 bg-slate-100/90 px-10.5 py-4.5 rounded-[36px] border-3 border-slate-200 mx-auto max-w-[585px]">
                    <div class="flex items-baseline space-x-3">
                        <span class="text-[30px] font-bold text-slate-500">最高</span>
                        <span id="main-temp-max" class="text-7xl font-black text-rose-500">--°</span>
                    </div>
                    <div class="h-15 w-[3px] bg-slate-300"></div>
                    <div class="flex items-baseline space-x-3">
                        <span class="text-[30px] font-bold text-slate-500">最低</span>
                        <span id="main-temp-min" class="text-6xl font-black text-sky-500">--°</span>
                    </div>
                </div>
            </div>

            <!-- Rain & Humidity Stats -->
            <div class="grid grid-cols-2 gap-6 w-full pt-4.5 border-t-3 border-slate-200/50 text-center">
                <div class="text-[33px] font-bold text-slate-600 border-r-3 border-slate-200">
                    <i class="fa-solid fa-umbrella text-blue-500 mr-1.5"></i>降水 <span id="main-rain" class="font-black text-slate-800 text-[42px]">--%</span>
                </div>
                <div class="text-[33px] font-bold text-slate-600">
                    <i class="fa-solid fa-droplet text-teal-500 mr-1.5"></i>湿度 <span id="main-humidity" class="font-black text-slate-800 text-[42px]">--%</span>
                </div>
            </div>
        </section>

        <!-- 1-HOUR FORECAST LIST (4 Rows - 3x Scaled) -->
        <section class="glass-card rounded-[48px] p-10.5 flex flex-col justify-between h-[1035px] shadow-sm overflow-hidden shrink-0">
            <h2 class="text-[42px] font-black text-[#0f2347] flex items-center border-b-3 border-slate-200/50 pb-4.5 shrink-0">
                <i class="fa-solid fa-clock text-amber-500 mr-4.5"></i>これからの天気
            </h2>
            
            <div id="hourly-list-container" class="flex-grow flex flex-col justify-between py-3 gap-3 overflow-hidden">
                <!-- Dynamic rows injected here -->
            </div>
        </section>

        <!-- FOOTER: Info & Live Active Badge (3x Scaled) -->
        <footer class="flex flex-col justify-center items-center bg-[#0f2347] text-white p-6 h-[195px] rounded-[36px] shadow-md border-3 border-blue-950 shrink-0 text-[30px]">
            <div class="font-bold text-slate-300 flex items-center gap-3 text-[33px]">
                <i class="fa-solid fa-database text-amber-400"></i> 出典:気象庁 / Open-Meteo
            </div>
            <div class="text-slate-400 mt-1.5 font-medium truncate text-[27px]">気象データ自動更新中</div>
            
            <!-- Active Indicator -->
            <div class="flex items-center space-x-3 text-emerald-400 font-bold mt-3 text-[27px]">
                <span class="relative flex h-6 w-6">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-6 w-6 bg-emerald-400"></span>
                </span>
                <span class="tracking-widest uppercase text-[24px]">Live Active</span>
            </div>
        </footer>

    </div>

    <!-- Script for Live Weather & 100% Real Hourly Forecast -->
    <script>
        const warningCodeMap = {
            "02": "暴風雪警報", "03": "大雨警報", "04": "洪水警報", "05": "暴風警報",
            "06": "大雪警報", "07": "波浪警報", "08": "高潮警報",
            "10": "大雨注意報", "12": "大雪注意報", "13": "風雪注意報", "14": "雷注意報",
            "15": "強風注意報", "16": "波浪注意報", "17": "高潮注意報", "18": "洪水注意報",
            "19": "赤潮注意報", "20": "濃霧注意報", "21": "乾燥注意報", "22": "雪崩注意報",
            "23": "低温注意報", "24": "霜注意報", "25": "着氷注意報", "26": "着雪注意報",
            "27": "融雪注意報", "28": "送電着雪注意報"
        };

        function parseWMOWeatherCode(code, hourNum) {
            const isNight = hourNum >= 19 || hourNum < 6;
            let weather = "晴れ";
            let iconClass = isNight ? "fa-solid fa-moon text-indigo-400" : "fa-solid fa-sun text-amber-500 animate-pulse";

            switch (code) {
                case 0:
                case 1:
                    weather = isNight ? "晴れ(夜)" : "晴れ";
                    iconClass = isNight ? "fa-solid fa-moon text-indigo-400" : "fa-solid fa-sun text-amber-500 animate-pulse";
                    break;
                case 2:
                    weather = "薄曇り";
                    iconClass = isNight ? "fa-solid fa-cloud-moon text-indigo-300" : "fa-solid fa-cloud-sun text-amber-400";
                    break;
                case 3:
                    weather = "曇り";
                    iconClass = "fa-solid fa-cloud text-slate-400";
                    break;
                case 45:
                case 48:
                    weather = "霧";
                    iconClass = "fa-solid fa-smog text-slate-400";
                    break;
                case 51:
                case 53:
                case 55:
                    weather = "小雨";
                    iconClass = "fa-solid fa-cloud-rain text-sky-400";
                    break;
                case 61:
                case 63:
                case 65:
                    weather = "雨";
                    iconClass = "fa-solid fa-cloud-showers-heavy text-sky-500";
                    break;
                case 71:
                case 73:
                case 75:
                case 77:
                    weather = "雪";
                    iconClass = "fa-solid fa-snowflake text-sky-300";
                    break;
                case 80:
                case 81:
                case 82:
                    weather = "にわか雨";
                    iconClass = "fa-solid fa-cloud-sun-rain text-sky-500";
                    break;
                case 85:
                case 86:
                    weather = "にわか雪";
                    iconClass = "fa-solid fa-snowflake text-sky-300";
                    break;
                case 95:
                case 96:
                case 99:
                    weather = "雷雨";
                    iconClass = "fa-solid fa-cloud-bolt text-amber-600";
                    break;
                default:
                    weather = "晴れ";
                    iconClass = isNight ? "fa-solid fa-moon text-indigo-400" : "fa-solid fa-sun text-amber-500 animate-pulse";
            }
            return { weather, iconClass };
        }

        async function fetchRealWeather() {
            try {
                const openMeteoUrl = 'https://api.open-meteo.com/v1/forecast?latitude=33.2289&longitude=131.6111&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=2';
                const response = await fetch(openMeteoUrl);
                
                if (!response.ok) throw new Error('Open-Meteo API fetch failed');
                const data = await response.json();

                if (data && data.hourly) {
                    const times = data.hourly.time;
                    const temps = data.hourly.temperature_2m;
                    const humidities = data.hourly.relative_humidity_2m;
                    const precipProbs = data.hourly.precipitation_probability;
                    const weatherCodes = data.hourly.weather_code;

                    const now = new Date();
                    const jstDate = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
                    const year = jstDate.getFullYear();
                    const month = String(jstDate.getMonth() + 1).padStart(2, '0');
                    const day = String(jstDate.getDate()).padStart(2, '0');
                    const hour = String(jstDate.getHours()).padStart(2, '0');
                    const currentISO = `${year}-${month}-${day}T${hour}`;
                    
                    let currentIndex = times.findIndex(t => t.startsWith(currentISO));
                    if (currentIndex === -1) currentIndex = 0;

                    const currentTemp = Math.round(temps[currentIndex]);
                    const currentHumidity = Math.round(humidities[currentIndex]);
                    const currentPrecip = Math.round(precipProbs[currentIndex]);
                    const currentWeatherCode = weatherCodes[currentIndex];

                    const maxTemp = data.daily && data.daily.temperature_2m_max ? Math.round(data.daily.temperature_2m_max[0]) : currentTemp + 3;
                    const minTemp = data.daily && data.daily.temperature_2m_min ? Math.round(data.daily.temperature_2m_min[0]) : currentTemp - 4;

                    const currentHourNum = jstDate.getHours();
                    const mainParsed = parseWMOWeatherCode(currentWeatherCode, currentHourNum);

                    updateMainWeatherUI(mainParsed, maxTemp, minTemp, currentPrecip, currentHumidity, currentHourNum);

                    const hourlyForecastList = [];
                    for (let i = 1; i <= 4; i++) {
                        const targetIdx = currentIndex + i;
                        if (targetIdx < times.length) {
                            const timeStr = times[targetIdx];
                            const hourNum = parseInt(timeStr.split('T')[1].split(':')[0], 10);
                            const parsed = parseWMOWeatherCode(weatherCodes[targetIdx], hourNum);
                            
                            hourlyForecastList.push({
                                hourNum: hourNum,
                                timeString: `${String(hourNum).padStart(2, '0')}:00`,
                                weather: parsed.weather,
                                iconClass: parsed.iconClass,
                                temp: Math.round(temps[targetIdx]),
                                rainProb: Math.round(precipProbs[targetIdx])
                            });
                        }
                    }

                    renderHourlyForecastRows(hourlyForecastList);
                }
            } catch (error) {
                console.error('Error fetching real weather data:', error);
            }
        }

        async function fetchOitaWarnings() {
            try {
                const response = await fetch('https://www.jma.go.jp/bosai/warning/data/warning/440000.json');
                if (!response.ok) throw new Error('Warning fetch failed');
                await response.json();
            } catch (e) {
                console.error("Warning fetch fallback:", e);
            }
        }

        function updateMainWeatherUI(parsedWeather, max, min, rain, humidity, currentHourNum) {
            const bgElement = document.getElementById('main-weather-bg');
            const iconElement = document.getElementById('main-weather-icon');
            const textElement = document.getElementById('main-weather-text');
            const isNight = currentHourNum >= 19 || currentHourNum < 6;
            
            if (isNight && (parsedWeather.weather.includes("晴れ") || parsedWeather.weather.includes("夜"))) {
                bgElement.className = "w-96 h-96 rounded-full flex items-center justify-center shadow-md weather-gradient-night border-9 my-3";
            } else if (parsedWeather.weather.includes("雨")) {
                bgElement.className = "w-96 h-96 rounded-full flex items-center justify-center shadow-md weather-gradient-rainy border-9 my-3";
            } else if (parsedWeather.weather.includes("曇")) {
                bgElement.className = "w-96 h-96 rounded-full flex items-center justify-center shadow-lg weather-gradient-cloudy border-9 my-3";
            } else {
                bgElement.className = "w-96 h-96 rounded-full flex items-center justify-center shadow-lg weather-gradient-sunny border-9 my-3";
            }
            
            const baseIconClass = parsedWeather.iconClass.replace('animate-pulse', '').replace('text-2xl', '').trim();
            iconElement.className = `${baseIconClass} text-[180px] drop-shadow-sm`;
            
            textElement.textContent = parsedWeather.weather;
            document.getElementById('main-temp-max').textContent = `${max}°`;
            document.getElementById('main-temp-min').textContent = `${min}°`;
            document.getElementById('main-rain').textContent = `${rain}%`;
            document.getElementById('main-humidity').textContent = `${humidity}%`;
        }

        function renderHourlyForecastRows(hourlyDataList) {
            const container = document.getElementById('hourly-list-container');
            container.innerHTML = "";

            hourlyDataList.forEach(item => {
                const row = document.createElement('div');
                // 3x scaled grid tracks: [192px_1fr_96px_126px]
                row.className = "grid grid-cols-[192px_1fr_96px_126px] gap-3 items-center bg-white/95 h-[174px] px-9 rounded-[36px] border-3 border-slate-100 shadow-sm transition-all hover:translate-x-1.5 duration-300 shrink-0 overflow-hidden";
                
                const isNight = item.hourNum >= 19 || item.hourNum < 6;
                const timeColorClass = isNight ? "text-indigo-950 font-black" : "text-slate-800 font-black";

                row.innerHTML = `
                    <div class="flex items-center overflow-hidden shrink-0">
                        <span class="text-5xl ${timeColorClass} leading-none font-black">${item.timeString}</span>
                    </div>
                    <div class="flex items-center space-x-4.5 overflow-hidden shrink-0">
                        <i class="${item.iconClass} text-6xl shrink-0"></i>
                        <span class="text-4xl font-extrabold text-slate-700 truncate">${item.weather}</span>
                    </div>
                    <div class="flex items-baseline justify-end text-right pr-1.5 shrink-0">
                        <span class="text-5xl font-black text-slate-800 leading-none">${item.temp}</span>
                        <span class="text-[30px] text-slate-400 font-bold leading-none">°</span>
                    </div>
                    <div class="flex items-center space-x-1.5 justify-end text-blue-600 font-black text-right shrink-0">
                        <i class="fa-solid fa-umbrella text-4xl opacity-80 shrink-0"></i>
                        <span class="text-5xl leading-none">${item.rainProb}%</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function initApp() {
            fetchRealWeather();
            fetchOitaWarnings();
        }
        initApp();
        
        setInterval(fetchRealWeather, 15 * 60 * 1000);
        setInterval(fetchOitaWarnings, 15 * 60 * 1000);
    </script>
</body>
</html>
