<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大分上野丘高校 デジタルサイネージ天気予報 (縦長250x850)</title>
    <!-- Tailwind CSS for layout & clean modern components -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons for weather indicators -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            /* Bright, active, school-appropriate sky morning gradient */
            background: linear-gradient(135deg, #e0f2fe 0%, #eff6ff 50%, #f0fdf4 100%);
            overflow: hidden;
            width: 250px;
            height: 850px;
            color: #0f172a; /* Slate 900 */
        }
        /* Strict 250x850 portrait container with autoscale helper */
        .portrait-container {
            width: 250px;
            height: 850px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center center;
            box-sizing: border-box;
            padding: 12px;
        }
        /* Glassmorphism soft panels */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 20px -6px rgba(15, 23, 42, 0.08);
        }
        /* Active weather gradients */
        .weather-gradient-sunny {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 1.5px solid #ffedd5;
        }
        .weather-gradient-cloudy {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 1.5px solid #f1f5f9;
        }
        .weather-gradient-rainy {
            background: linear-gradient(135deg, #f0f9ff 0%, #bae6fd 100%);
            border: 2px solid #bae6fd;
        }
        .weather-gradient-night {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 2px solid #4338ca;
        }
    </style>
</head>
<body>

    <div id="signage" class="portrait-container flex flex-col justify-between">
        
        <!-- HEADER: Simple Title without School Badge or Name -->
        <header class="flex items-center justify-center border-b-2 border-blue-900/10 pb-2 h-[55px] shrink-0">
            <h1 class="text-3xl font-black tracking-widest text-[#0f2347] flex items-center gap-2">
                <i class="fa-solid fa-cloud-sun text-blue-600"></i>天気予報
            </h1>
        </header>

        <!-- ADVISORY/WARNING AREA -->
        <div id="warning-container" class="flex items-center h-[32px] bg-slate-100/90 px-3 py-1 rounded-xl border border-slate-200/50 overflow-hidden shrink-0">
            <span class="text-[11px] font-black text-slate-500 mr-1 shrink-0 flex items-center gap-1">
                <i class="fa-solid fa-shield-halved text-blue-600"></i> 防災:
            </span>
            <div id="warning-badges" class="flex items-center overflow-hidden w-full">
                <!-- Dynamic Warning Content -->
                <span class="text-[11px] font-black text-emerald-600 truncate"><i class="fa-solid fa-circle-check mr-0.5"></i>発表なし</span>
            </div>
        </div>

        <!-- TODAY'S WEATHER CARD -->
        <section class="glass-card rounded-2xl p-4 flex flex-col justify-between items-center h-[310px] shadow-sm shrink-0">
            <div class="text-center w-full">
                <span class="px-3 py-0.5 bg-blue-50 text-blue-900 border border-blue-200 rounded-full text-[10px] font-black tracking-wider inline-block">
                    大分市（学校上空）
                </span>
            </div>

            <!-- Dynamic Weather Icon -->
            <div id="main-weather-bg" class="w-32 h-32 rounded-full flex items-center justify-center shadow-md weather-gradient-sunny border-3 my-1">
                <i id="main-weather-icon" class="fa-solid fa-sun text-6xl text-amber-500 drop-shadow-sm"></i>
            </div>

            <!-- Temp & Weather Text info -->
            <div class="text-center w-full">
                <div id="main-weather-text" class="text-3xl font-black text-[#0f2347] mb-1">晴れ</div>
                <div class="flex items-center justify-center space-x-3 bg-slate-100/90 px-3.5 py-1.5 rounded-xl border border-slate-200 mx-auto max-w-[195px]">
                    <div class="flex items-baseline space-x-1">
                        <span class="text-[10px] font-bold text-slate-500">最高</span>
                        <span id="main-temp-max" class="text-2xl font-black text-rose-500">--°</span>
                    </div>
                    <div class="h-5 w-[1px] bg-slate-300"></div>
                    <div class="flex items-baseline space-x-1">
                        <span class="text-[10px] font-bold text-slate-500">最低</span>
                        <span id="main-temp-min" class="text-xl font-black text-sky-500">--°</span>
                    </div>
                </div>
            </div>

            <!-- Rain & Humidity Stats -->
            <div class="grid grid-cols-2 gap-2 w-full pt-1.5 border-t border-slate-200/50 text-center">
                <div class="text-[11px] font-bold text-slate-600 border-r border-slate-200">
                    <i class="fa-solid fa-umbrella text-blue-500 mr-0.5"></i>降水 <span id="main-rain" class="font-black text-slate-800 text-sm">--%</span>
                </div>
                <div class="text-[11px] font-bold text-slate-600">
                    <i class="fa-solid fa-droplet text-teal-500 mr-0.5"></i>湿度 <span id="main-humidity" class="font-black text-slate-800 text-sm">--%</span>
                </div>
            </div>
        </section>

        <!-- 1-HOUR FORECAST LIST (4 Rows - Exact Real Data) -->
        <section class="glass-card rounded-2xl p-3.5 flex flex-col justify-between h-[315px] shadow-sm overflow-hidden shrink-0">
            <h2 class="text-sm font-black text-[#0f2347] flex items-center border-b border-slate-200/50 pb-1.5 shrink-0">
                <i class="fa-solid fa-clock text-amber-500 mr-1.5"></i>これからの天気
            </h2>
            
            <!-- Tightly pack with specific gaps to guarantee no overflow out of card -->
            <div id="hourly-list-container" class="flex-grow flex flex-col justify-between py-1 gap-1 overflow-hidden">
                <!-- Dynamic rows injected here -->
            </div>
        </section>

        <!-- FOOTER: Info & Live Active Badge -->
        <footer class="flex flex-col justify-center items-center bg-[#0f2347] text-white p-2 h-[65px] rounded-xl shadow-md border border-blue-950 shrink-0 text-[10px]">
            <div class="font-bold text-slate-300 flex items-center gap-1 text-[11px]">
                <i class="fa-solid fa-database text-amber-400"></i> 出典:気象庁 / Open-Meteo
            </div>
            <div class="text-slate-400 mt-0.5 font-medium truncate text-[9px]">大分市中部データ自動反映中</div>
            
            <!-- Active Indicator -->
            <div class="flex items-center space-x-1 text-emerald-400 font-bold mt-1 text-[9px]">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
                </span>
                <span class="tracking-widest uppercase text-[8px]">Live Active</span>
            </div>
        </footer>

    </div>

    <!-- Script for Live Weather, Dynamic Warnings & 100% Real Hourly Forecast -->
    <script>
        // Warning Code to Japanese text Map (JMA standard warning codes)
        const warningCodeMap = {
            "02": "暴風雪警報", "03": "大雨警報", "04": "洪水警報", "05": "暴風警報",
            "06": "大雪警報", "07": "波浪警報", "08": "高潮警報",
            "10": "大雨注意報", "12": "大雪注意報", "13": "風雪注意報", "14": "雷注意報",
            "15": "強風注意報", "16": "波浪注意報", "17": "高潮注意報", "18": "洪水注意報",
            "19": "赤潮注意報", "20": "濃霧注意報", "21": "乾燥注意報", "22": "雪崩注意報",
            "23": "低温注意報", "24": "霜注意報", "25": "着氷注意報", "26": "着雪注意報",
            "27": "融雪注意報", "28": "送電着雪注意報"
        };

        // WMO Weather Interpretation Code Mapper (Open-Meteo Standard API)
        function parseWMOWeatherCode(code, hourNum) {
            const isNight = hourNum >= 19 || hourNum < 6;
            let weather = "晴れ";
            let iconClass = isNight ? "fa-solid fa-moon text-indigo-400" : "fa-solid fa-sun text-amber-500 animate-pulse";

            switch (code) {
                case 0:
                case 1:
                    weather = isNight ? "晴れ(夜)" : "晴れ";
                    iconClass = isNight ? "fa-solid fa-moon text-indigo-400" : "fa-solid fa-sun text-amber-500 animate-pulse";
                    break;
                case 2:
                    weather = "薄曇り";
                    iconClass = isNight ? "fa-solid fa-cloud-moon text-indigo-300" : "fa-solid fa-cloud-sun text-amber-400";
                    break;
                case 3:
                    weather = "曇り";
                    iconClass = "fa-solid fa-cloud text-slate-400";
                    break;
                case 45:
                case 48:
                    weather = "霧";
                    iconClass = "fa-solid fa-smog text-slate-400";
                    break;
                case 51:
                case 53:
                case 55:
                    weather = "小雨";
                    iconClass = "fa-solid fa-cloud-rain text-sky-400";
                    break;
                case 61:
                case 63:
                case 65:
                    weather = "雨";
                    iconClass = "fa-solid fa-cloud-showers-heavy text-sky-500";
                    break;
                case 71:
                case 73:
                case 75:
                case 77:
                    weather = "雪";
                    iconClass = "fa-solid fa-snowflake text-sky-300";
                    break;
                case 80:
                case 81:
                case 82:
                    weather = "にわか雨";
                    iconClass = "fa-solid fa-cloud-sun-rain text-sky-500";
                    break;
                case 85:
                case 86:
                    weather = "にわか雪";
                    iconClass = "fa-solid fa-snowflake text-sky-300";
                    break;
                case 95:
                case 96:
                case 99:
                    weather = "雷雨";
                    iconClass = "fa-solid fa-cloud-bolt text-amber-600";
                    break;
                default:
                    weather = "晴れ";
                    iconClass = isNight ? "fa-solid fa-moon text-indigo-400" : "fa-solid fa-sun text-amber-500 animate-pulse";
            }
            return { weather, iconClass };
        }

        // Fetch 100% Real Hourly Forecast (Oita Uenogaoka High School Lat: 33.2289, Lon: 131.6111)
        async function fetchRealWeather() {
            try {
                // Open-Meteo provides accurate 1-hour step forecast without API keys
                const openMeteoUrl = 'https://api.open-meteo.com/v1/forecast?latitude=33.2289&longitude=131.6111&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=2';
                const response = await fetch(openMeteoUrl);
                
                if (!response.ok) throw new Error('Open-Meteo API fetch failed');
                const data = await response.json();

                if (data && data.hourly) {
                    const times = data.hourly.time;
                    const temps = data.hourly.temperature_2m;
                    const humidities = data.hourly.relative_humidity_2m;
                    const precipProbs = data.hourly.precipitation_probability;
                    const weatherCodes = data.hourly.weather_code;

                    // Find index matching current hour (JST / Asia/Tokyo)
                    const now = new Date();
                    // 端末のタイムゾーン設定に関わらず常に正確なJST(UTC+9)の日時オブジェクトを算出
                    const jstDate = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
                    const year = jstDate.getFullYear();
                    const month = String(jstDate.getMonth() + 1).padStart(2, '0');
                    const day = String(jstDate.getDate()).padStart(2, '0');
                    const hour = String(jstDate.getHours()).padStart(2, '0');
                    const currentISO = `${year}-${month}-${day}T${hour}`; // "YYYY-MM-DDTHH"
                    
                    let currentIndex = times.findIndex(t => t.startsWith(currentISO));
                    if (currentIndex === -1) currentIndex = 0; // Fallback to first if mismatch

                    // Extract Today's current stats & Daily max/min
                    const currentTemp = Math.round(temps[currentIndex]);
                    const currentHumidity = Math.round(humidities[currentIndex]);
                    const currentPrecip = Math.round(precipProbs[currentIndex]);
                    const currentWeatherCode = weatherCodes[currentIndex];

                    const maxTemp = data.daily && data.daily.temperature_2m_max ? Math.round(data.daily.temperature_2m_max[0]) : currentTemp + 3;
                    const minTemp = data.daily && data.daily.temperature_2m_min ? Math.round(data.daily.temperature_2m_min[0]) : currentTemp - 4;

                    const currentHourNum = jstDate.getHours();
                    const mainParsed = parseWMOWeatherCode(currentWeatherCode, currentHourNum);

                    // Update Main Weather UI Card with night indicator support
                    updateMainWeatherUI(mainParsed, maxTemp, minTemp, currentPrecip, currentHumidity, currentHourNum);

                    // Extract next 4 hours REAL forecast rows
                    const hourlyForecastList = [];
                    for (let i = 1; i <= 4; i++) {
                        const targetIdx = currentIndex + i;
                        if (targetIdx < times.length) {
                            const timeStr = times[targetIdx]; // "2026-09-30T14:00"
                            const hourNum = parseInt(timeStr.split('T')[1].split(':')[0], 10);
                            const parsed = parseWMOWeatherCode(weatherCodes[targetIdx], hourNum);
                            
                            hourlyForecastList.push({
                                hourNum: hourNum,
                                timeString: `${String(hourNum).padStart(2, '0')}:00`,
                                weather: parsed.weather,
                                iconClass: parsed.iconClass,
                                temp: Math.round(temps[targetIdx]),
                                rainProb: Math.round(precipProbs[targetIdx])
                            });
                        }
                    }

                    // Render Hourly UI Rows
                    renderHourlyForecastRows(hourlyForecastList);
                }
            } catch (error) {
                console.error('Error fetching real weather data:', error);
            }
        }

        // Fetch JMA Warnings/Advisories for Oita City
        async function fetchOitaWarnings() {
            try {
                const response = await fetch('https://www.jma.go.jp/bosai/warning/data/warning/440000.json');
                if (!response.ok) throw new Error('Warning fetch failed');
                const data = await response.json();
                
                let activeWarnings = [];
                
                if (data && Array.isArray(data)) {
                    data.forEach(item => {
                        if (item.areaTypes && Array.isArray(item.areaTypes)) {
                            item.areaTypes.forEach(areaType => {
                                if (areaType.areas && Array.isArray(areaType.areas)) {
                                    const oitaArea = areaType.areas.find(a => a.code === "4420100" || a.name === "大分市");
                                    if (oitaArea && oitaArea.warnings && Array.isArray(oitaArea.warnings)) {
                                        const filtered = oitaArea.warnings.filter(w => {
                                            return w.status && w.status !== "解除" && w.status !== "非発表" && w.status !== "なし" && w.status !== "現在発表なし";
                                        });
                                        if (filtered.length > 0) {
                                            activeWarnings = filtered;
                                        }
                                    }
                                }
                            });
                        }
                    });
                }
                
                updateWarningUI(activeWarnings);
            } catch (e) {
                console.error("Warning parsing failed, fallback default state:", e);
                updateWarningUI([]);
            }
        }

        function updateWarningUI(warnings) {
            const container = document.getElementById('warning-badges');
            container.innerHTML = "";

            if (!warnings || warnings.length === 0) {
                container.innerHTML = `<span class="text-[11px] font-extrabold text-emerald-600 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i>発表なし</span>`;
                return;
            }

            const w = warnings[0];
            const name = warningCodeMap[w.code] || w.name || "気象注意報";
            const isAlarm = name.includes("警報");
            
            const badge = document.createElement('span');
            if (isAlarm) {
                badge.className = "px-2 py-0.5 bg-rose-500 text-white border border-rose-600 rounded-md text-[9px] font-black tracking-wider animate-pulse flex items-center gap-0.5 truncate max-w-[170px]";
                badge.innerHTML = `<i class="fa-solid fa-circle-exclamation shrink-0"></i>${name}`;
            } else {
                badge.className = "px-2 py-0.5 bg-amber-100 text-amber-800 border border-amber-300 rounded-lg text-[9px] font-extrabold flex items-center gap-0.5 truncate max-w-[170px]";
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation shrink-0"></i>${name}`;
            }
            container.appendChild(badge);

            if (warnings.length > 1) {
                const countBadge = document.createElement('span');
                countBadge.className = "text-[9px] font-black text-slate-500 ml-1 shrink-0";
                countBadge.textContent = `他${warnings.length - 1}件`;
                container.appendChild(countBadge);
            }
        }

        function updateMainWeatherUI(parsedWeather, max, min, rain, humidity, currentHourNum) {
            const bgElement = document.getElementById('main-weather-bg');
            const iconElement = document.getElementById('main-weather-icon');
            const textElement = document.getElementById('main-weather-text');
            const isNight = currentHourNum >= 19 || currentHourNum < 6;
            
            if (isNight && (parsedWeather.weather.includes("晴れ") || parsedWeather.weather.includes("夜"))) {
                bgElement.className = "w-32 h-32 rounded-full flex items-center justify-center shadow-md weather-gradient-night border-3 my-1";
            } else if (parsedWeather.weather.includes("雨")) {
                bgElement.className = "w-32 h-32 rounded-full flex items-center justify-center shadow-md weather-gradient-rainy border-3 my-1";
            } else if (parsedWeather.weather.includes("曇")) {
                bgElement.className = "w-32 h-32 rounded-full flex items-center justify-center shadow-lg weather-gradient-cloudy border-3 my-1";
            } else {
                bgElement.className = "w-32 h-32 rounded-full flex items-center justify-center shadow-lg weather-gradient-sunny border-3 my-1";
            }
            
            // Clean up size utilities and replace with main text-6xl icon class
            const baseIconClass = parsedWeather.iconClass.replace('animate-pulse', '').replace('text-2xl', '').trim();
            iconElement.className = `${baseIconClass} text-6xl drop-shadow-sm`;
            
            textElement.textContent = parsedWeather.weather;
            document.getElementById('main-temp-max').textContent = `${max}°`;
            document.getElementById('main-temp-min').textContent = `${min}°`;
            document.getElementById('main-rain').textContent = `${rain}%`;
            document.getElementById('main-humidity').textContent = `${humidity}%`;
        }

        // Render exact 1-hour forecast rows using real API predictions
        function renderHourlyForecastRows(hourlyDataList) {
            const container = document.getElementById('hourly-list-container');
            container.innerHTML = "";

            hourlyDataList.forEach(item => {
                const row = document.createElement('div');
                row.className = "grid grid-cols-[64px_1fr_32px_42px] gap-1 items-center bg-white/95 h-[54px] px-3 rounded-xl border border-slate-100 shadow-sm transition-all hover:translate-x-0.5 duration-300 shrink-0 overflow-hidden";
                
                const isNight = item.hourNum >= 19 || item.hourNum < 6;
                const timeColorClass = isNight ? "text-indigo-950 font-black" : "text-slate-800 font-black";

                row.innerHTML = `
                    <!-- Column 1: Time (64px) -->
                    <div class="flex items-center overflow-hidden shrink-0">
                        <span class="text-lg ${timeColorClass} leading-none font-black">${item.timeString}</span>
                    </div>
                    
                    <!-- Column 2: Weather Icon & Text -->
                    <div class="flex items-center space-x-1.5 overflow-hidden shrink-0">
                        <i class="${item.iconClass} text-2xl shrink-0"></i>
                        <span class="text-xs font-extrabold text-slate-700 truncate">${item.weather}</span>
                    </div>
                    
                    <!-- Column 3: Real Temp (32px) -->
                    <div class="flex items-baseline justify-end text-right pr-0.5 shrink-0">
                        <span class="text-lg font-black text-slate-800 leading-none">${item.temp}</span>
                        <span class="text-[10px] text-slate-400 font-bold leading-none">°</span>
                    </div>
                    
                    <!-- Column 4: Real Rain Prob (42px) -->
                    <div class="flex items-center space-x-0.5 justify-end text-blue-600 font-black text-right shrink-0">
                        <i class="fa-solid fa-umbrella text-xs opacity-80 shrink-0"></i>
                        <span class="text-sm leading-none">${item.rainProb}%</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Run fetch functions initially and periodically
        function initApp() {
            fetchRealWeather();
            fetchOitaWarnings();
        }
        initApp();
        
        setInterval(fetchRealWeather, 15 * 60 * 1000); // Refresh every 15 minutes
        setInterval(fetchOitaWarnings, 15 * 60 * 1000);

        // Aspect Ratio auto scaling helper for 250x850 portrait layout
        function resizeSignage() {
            const container = document.getElementById('signage');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const targetWidth = 250;
            const targetHeight = 850;
            
            const scaleX = windowWidth / targetWidth;
            const scaleY = windowHeight / targetHeight;
            const scale = Math.min(scaleX, scaleY);
            
            container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', resizeSignage);
        resizeSignage();
    </script>
</body>
</html>
